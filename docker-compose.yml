# Local learning stack. Passwords are throwaway demo values; do not reuse this file for anything real.
services:
  api:
    build: ./src/Listings.Api
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Username=demo;Password=demo;Database=listings"
      SelfBaseUrl: "http://localhost:8080"
      # Standard OpenTelemetry env var: where to send OTLP data (gRPC port of the Collector).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    # The aspnet runtime image has no curl/wget, so probe /healthz with bash's built-in /dev/tcp.
    # `docker compose ps` shows "healthy" once the app is really listening (not just the port mapped).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: demo, POSTGRES_PASSWORD: demo, POSTGRES_DB: listings }
    volumes:
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db:/db:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the unix socket, which already answers
      # during first-run init (while the seed is still loading) and would let the API start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d listings"]
      interval: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]   # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
