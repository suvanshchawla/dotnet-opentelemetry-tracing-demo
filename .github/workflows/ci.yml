name: ci
on:
  push: { branches: [main] }
  pull_request:

# Least privilege: the workflow only needs to read the repository contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest   # has Docker preinstalled, which Testcontainers needs
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
